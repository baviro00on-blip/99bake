<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>くくバケ - バケモノカードを集めよう！</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap');

        body {
            font-family: 'Zen Maru Gothic', sans-serif;
            background: linear-gradient(135deg, #2b080c 0%, #4a0e17 50%, #681522 100%);
            color: #fff;
            user-select: none;
            height: 100vh;
            overflow: hidden;
        }

        /* 3Dボタン風アニメーション */
        .btn-3d {
            transition: all 0.1s ease;
            box-shadow: 0 5px 0 rgba(0,0,0,0.4);
        }
        .btn-3d:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 rgba(0,0,0,0.4);
        }

        /* カードのホログラム・キラ演出（カード枠内に限定） */
        .card-foil {
            position: relative;
            overflow: hidden;
        }
        .card-foil::after {
            content: '';
            position: absolute;
            top: -100%;
            left: -100%;
            width: 300%;
            height: 300%;
            background: linear-gradient(
                115deg,
                transparent 25%,
                rgba(255, 255, 255, 0.6) 45%,
                rgba(255, 0, 128, 0.4) 50%,
                rgba(0, 255, 255, 0.4) 55%,
                transparent 75%
            );
            transform: rotate(25deg);
            pointer-events: none;
            opacity: 0.7;
            animation: foilShift 4s infinite linear;
        }

        @keyframes foilShift {
            0% { transform: translateY(-30%) rotate(25deg); }
            100% { transform: translateY(30%) rotate(25deg); }
        }

        .gold-glow {
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.9), 0 0 5px rgba(255, 255, 255, 0.8), inset 0 0 12px rgba(251, 191, 36, 0.6);
        }

        .super-glow {
            box-shadow: 0 0 25px rgba(236, 72, 153, 0.9), 0 0 10px rgba(56, 189, 248, 0.9), inset 0 0 15px rgba(255, 255, 255, 0.8);
        }

        /* 震えるアニメーション（間違い時） */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        .animate-shake {
            animation: shake 0.4s ease-in-out;
        }

        /* 脈動アニメーション */
        @keyframes pulse-subtle {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        .animate-pulse-subtle {
            animation: pulse-subtle 2s infinite ease-in-out;
        }

        /* 風で揺れる草むらのアニメーション */
        @keyframes grassSway {
            0%, 100% { transform: skewX(0deg); }
            50% { transform: skewX(-4deg); }
        }
        .animate-grass-sway {
            transform-origin: bottom center;
            animation: grassSway 2.5s ease-in-out infinite;
        }

        /* ミサイル飛翔アニメーション */
        @keyframes flyMissile {
            0% { transform: translate(0, 0) scale(0.6) rotate(15deg); opacity: 0; }
            20% { opacity: 1; }
            80% { transform: translate(180px, -10px) scale(1.1) rotate(5deg); opacity: 1; }
            100% { transform: translate(210px, 0px) scale(1.2) rotate(0deg); opacity: 0; }
        }
        .animate-fly-missile {
            animation: flyMissile 0.45s ease-in forwards;
        }

        /* ドット絵キャラクターの小刻みなバトルアニメーション */
        @keyframes pixelBounce {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-3px); }
        }
        .animate-pixel-bounce {
            animation: pixelBounce 0.4s steps(2) infinite;
        }

        @keyframes pixelMonster {
            0%, 100% { transform: translateY(0px) scaleX(1); }
            50% { transform: translateY(-3px) scaleX(1.02); }
        }
        .animate-pixel-monster {
            animation: pixelMonster 0.5s steps(2) infinite;
        }

        /* ドット絵のくっきり描画指定 */
        .pixelated {
            image-rendering: pixelated;
        }

        /* 超豪華レインボーネオンボーダー（全クリア・MUR時） */
        @keyframes rainbowGlow {
            0% { box-shadow: 0 0 25px #ef4444, inset 0 0 15px #ef4444; }
            20% { box-shadow: 0 0 25px #f59e0b, inset 0 0 15px #f59e0b; }
            40% { box-shadow: 0 0 25px #10b981, inset 0 0 15px #10b981; }
            60% { box-shadow: 0 0 25px #06b6d4, inset 0 0 15px #06b6d4; }
            80% { box-shadow: 0 0 25px #8b5cf6, inset 0 0 15px #8b5cf6; }
            100% { box-shadow: 0 0 25px #ec4899, inset 0 0 15px #ec4899; }
        }
        .animate-rainbow-glow {
            animation: rainbowGlow 2s linear infinite;
        }
    </style>
</head>
<body class="flex flex-col h-screen text-slate-100 overflow-hidden relative">

    <!-- お祝い用花火・紙吹雪 Canvas -->
    <canvas id="celebration-canvas" class="pointer-events-none fixed inset-0 z-50 hidden"></canvas>

    <!-- ヘッダーナビゲーション (エンジ色テーマ) -->
    <header class="bg-red-950/90 border-b border-amber-500/40 px-4 py-2.5 shadow-md shrink-0">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2 cursor-pointer" onclick="showStageSelect()">
                <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-rose-700 via-amber-600 to-yellow-400 flex items-center justify-center font-black text-lg shadow-md border-2 border-white text-stone-950">
                    👾
                </div>
                <h1 class="font-black text-lg sm:text-xl tracking-wider text-amber-300 drop-shadow">くくバケ</h1>
            </div>
            
            <div class="flex items-center space-x-2">
                <button onclick="showAlbum()" class="bg-rose-900 hover:bg-rose-800 text-white font-bold py-1.5 px-3.5 rounded-full border border-amber-400/40 flex items-center gap-1.5 shadow-md btn-3d text-xs sm:text-sm">
                    <i data-lucide="book-open" class="w-4 h-4 text-yellow-300"></i>
                    <span>カードずかん (<span id="card-count">0/40</span>)</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-4xl w-full mx-auto p-3 flex flex-col justify-between overflow-hidden">

        <!-- 1. 段選択画面 -->
        <section id="stage-select-screen" class="flex flex-col justify-between h-full py-2 space-y-3">
            <div class="text-center space-y-1">
                <h2 class="text-xl sm:text-2xl font-extrabold text-white drop-shadow">「ワールド」と「段」をえらぼう！</h2>
                <p class="text-amber-200 text-xs sm:text-sm">クリアするとバケモノカードをGETできるよ！</p>
            </div>

            <!-- ワールド切り替えタブ (上り・下り・ランダム・マスター) -->
            <div id="world-tabs" class="flex justify-center gap-1.5 max-w-xl mx-auto w-full bg-stone-950/80 p-1.5 rounded-2xl border border-amber-500/30 overflow-x-auto">
                <button onclick="switchWorld('asc')" id="tab-asc" class="flex-1 min-w-[90px] py-1.5 px-2 rounded-xl font-black text-xs sm:text-sm transition-all bg-amber-400 text-stone-950 border-2 border-white shadow flex items-center justify-center gap-1">
                    <span>① 上り</span>
                </button>
                <button onclick="switchWorld('desc')" id="tab-desc" class="flex-1 min-w-[90px] py-1.5 px-2 rounded-xl font-black text-xs sm:text-sm transition-all bg-stone-900 text-stone-400 flex items-center justify-center gap-1">
                    <span>② 下り</span>
                </button>
                <button onclick="switchWorld('rand')" id="tab-rand" class="flex-1 min-w-[90px] py-1.5 px-2 rounded-xl font-black text-xs sm:text-sm transition-all bg-stone-900 text-stone-400 flex items-center justify-center gap-1">
                    <span>③ ランダム</span>
                </button>
                <button onclick="switchWorld('master')" id="tab-master" class="flex-1 min-w-[100px] py-1.5 px-2 rounded-xl font-black text-xs sm:text-sm transition-all bg-stone-900 text-stone-400 flex items-center justify-center gap-1">
                    <span>④ マスター</span>
                </button>
            </div>

            <!-- 通知用トーストメッセージ -->
            <div id="toast-message" class="hidden transition-all duration-300 transform -translate-y-2 opacity-0 bg-stone-950/95 border-2 border-amber-400 text-amber-200 text-xs sm:text-sm font-black px-4 py-2 rounded-full shadow-2xl text-center max-w-sm mx-auto">
                メッセージ
            </div>

            <div id="stages-grid" class="grid grid-cols-3 gap-3 max-w-xl mx-auto w-full my-auto">
                <!-- JavaScriptで段ボタンが動的に挿入されます -->
            </div>

            <div id="stage-footer-tip" class="text-center text-amber-200/70 text-[11px]">
                💡 クリアすると次の段がオープン！残りライフが多いほどレアなカードがもらえるよ！
            </div>
        </section>

        <!-- 2. ゲーム画面 -->
        <section id="game-screen" class="hidden flex flex-col justify-between h-full max-w-md mx-auto w-full py-1">
            <!-- 進行度・ヘッダー情報 -->
            <div class="w-full bg-stone-950/80 p-2.5 rounded-2xl border border-amber-500/30 flex justify-between items-center shadow-lg shrink-0">
                <div class="flex items-center gap-2">
                    <span id="current-stage-title" class="text-lg sm:text-xl font-black text-amber-300">1の段</span>
                    <span id="current-round-tag" class="text-[11px] bg-rose-900/60 text-amber-200 px-2 py-0.5 rounded-full border border-rose-500/40">上りワールド</span>
                </div>
                <!-- ライフ表示 -->
                <div class="flex items-center space-x-1" id="hearts-container">
                    <i data-lucide="heart" class="w-6 h-6 text-red-500 fill-red-500"></i>
                    <i data-lucide="heart" class="w-6 h-6 text-red-500 fill-red-500"></i>
                    <i data-lucide="heart" class="w-6 h-6 text-red-500 fill-red-500"></i>
                </div>
            </div>

            <!-- マスターモード用 10連四角ゲージ表示エリア -->
            <div id="master-gauge-container" class="hidden w-full bg-stone-950/80 p-2 rounded-xl border border-amber-500/30 flex items-center justify-between gap-2 shadow-md shrink-0 my-1">
                <span class="text-[10px] font-black text-amber-300 shrink-0">のこり</span>
                <div id="master-gauge-boxes" class="flex flex-1 items-center justify-between gap-1">
                    <!-- JSで10個の四角ゲージを動的生成 -->
                </div>
            </div>

            <!-- ドット絵バトルエリア（青空と風に揺れる草むら背景） -->
            <div class="w-full border-2 border-emerald-400/60 rounded-2xl p-2 flex items-center justify-between shrink-0 my-1 relative overflow-hidden h-36 shadow-2xl bg-gradient-to-b from-sky-400 via-sky-200 to-emerald-300">
                
                <!-- 雲アニメーション（背景遠景） -->
                <div class="absolute top-2 left-6 w-12 h-4 bg-white/70 rounded-full blur-[0.5px]"></div>
                <div class="absolute top-4 right-12 w-16 h-5 bg-white/60 rounded-full blur-[0.5px]"></div>

                <!-- 風で揺れる草むらレイヤー（下部） -->
                <div class="absolute bottom-0 inset-x-0 h-10 bg-emerald-500 border-t-2 border-emerald-400 flex items-end justify-around animate-grass-sway overflow-hidden pointer-events-none">
                    <div class="w-0 h-0 border-l-[8px] border-l-transparent border-r-[8px] border-r-transparent border-b-[18px] border-b-emerald-600"></div>
                    <div class="w-0 h-0 border-l-[12px] border-l-transparent border-r-[12px] border-r-transparent border-b-[24px] border-b-emerald-600"></div>
                    <div class="w-0 h-0 border-l-[10px] border-l-transparent border-r-[10px] border-r-transparent border-b-[20px] border-b-emerald-600"></div>
                    <div class="w-0 h-0 border-l-[14px] border-l-transparent border-r-[14px] border-r-transparent border-b-[26px] border-b-emerald-600"></div>
                    <div class="w-0 h-0 border-l-[9px] border-l-transparent border-r-[9px] border-r-transparent border-b-[19px] border-b-emerald-600"></div>
                </div>

                <!-- 左：化け物に挑むハンター -->
                <div class="relative z-20 flex items-center justify-center pl-2">
                    <div class="w-16 h-16 animate-pixel-bounce flex items-center justify-center filter drop-shadow-md select-none">
                        <!-- 化け物に向かって大剣を構えるハンターSVG -->
                        <svg class="w-16 h-16 pixelated filter drop-shadow-lg" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <!-- 赤いマント -->
                            <path d="M6 14 L1 26 L11 28 L10 16 Z" fill="#991b1b" stroke="#450a0a" stroke-width="0.8"/>
                            <!-- 胴体甲冑（エンジ・ゴールドアクセント） -->
                            <rect x="9" y="14" width="11" height="12" rx="1" fill="#475569" stroke="#0f172a" stroke-width="0.8"/>
                            <rect x="11" y="16" width="7" height="8" fill="#f59e0b" stroke="#b45309" stroke-width="0.5"/>
                            <!-- 脚＆ブーツ -->
                            <rect x="10" y="26" width="4" height="5" fill="#334155"/>
                            <rect x="16" y="26" width="4" height="5" fill="#334155"/>
                            <rect x="9" y="30" width="5" height="2" fill="#0f172a"/>
                            <rect x="16" y="30" width="5" height="2" fill="#0f172a"/>
                            <!-- 腕＆右側の化け物を突く大剣 -->
                            <path d="M16 16 L23 15 L22 19 Z" fill="#64748b" stroke="#0f172a" stroke-width="0.8"/>
                            <!-- 光る大剣（右側に向かって伸びる刃） -->
                            <path d="M20 18 L31 10 L32 12 L21 20 Z" fill="#e2e8f0" stroke="#0f172a" stroke-width="0.8"/>
                            <path d="M21 17 L30 11" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round"/>
                            <circle cx="20" cy="19" r="1.5" fill="#fbbf24"/> <!-- 剣の護手 -->
                            <!-- ハンターの兜（バイザー＆赤い羽根飾り） -->
                            <path d="M8 7 C8 2 20 2 20 7 L21 14 L8 14 Z" fill="#64748b" stroke="#0f172a" stroke-width="0.8"/>
                            <rect x="11" y="9" width="9" height="3" rx="0.5" fill="#38bdf8"/> <!-- 輝くツインバイザー -->
                            <polygon points="12,2 14,-3 16,3" fill="#ef4444" stroke="#7f1d1d" stroke-width="0.5"/> <!-- 兜の前立 -->
                        </svg>
                    </div>

                    <!-- 飛んでいくミサイル -->
                    <div id="missile-anim" class="hidden absolute left-12 top-4 z-30 pointer-events-none">
                        <svg class="w-8 h-8 pixelated drop-shadow-lg" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x="2" y="6" width="10" height="4" fill="#f97316"/>
                            <rect x="12" y="7" width="3" height="2" fill="#ef4444"/>
                            <rect x="0" y="5" width="3" height="2" fill="#ea580c"/>
                            <rect x="0" y="9" width="3" height="2" fill="#ea580c"/>
                            <rect x="4" y="7" width="2" height="2" fill="#fef08a"/>
                        </svg>
                    </div>
                </div>

                <!-- 右：野生のバケモノ -->
                <div id="wild-pokemon-container" class="relative z-10 flex flex-col items-center justify-center w-36 h-32 pr-2 overflow-visible">
                    <div id="target-pokemon-scale-box" class="transition-all duration-500 origin-center flex flex-col items-center scale-[2.2]">
                        <div class="animate-pixel-monster flex flex-col items-center">
                            <div id="pixel-monster-svg-box" class="w-16 h-16 filter drop-shadow-xl flex items-center justify-center">
                                <!-- JSで生成されるバケモノアイコン -->
                            </div>
                        </div>
                    </div>

                    <div id="hit-explosion" class="hidden absolute z-30 pointer-events-none">
                        <div class="text-3xl animate-ping">💥</div>
                    </div>

                    <div id="capture-stars" class="hidden absolute z-40 pointer-events-none text-2xl font-black text-amber-300 animate-bounce drop-shadow">
                        ✨ GET! ✨
                    </div>
                </div>
            </div>

            <!-- 問題表示 -->
            <div class="w-full shrink-0 my-2">
                <div class="w-full h-32 sm:h-36 rounded-2xl bg-gradient-to-r from-amber-400 via-yellow-300 to-amber-500 border-4 border-white shadow-xl flex flex-col items-center justify-center p-2 text-stone-900 animate-pulse-subtle">
                    <div id="question-text" class="text-4xl sm:text-5xl font-black tracking-wider text-stone-900 my-1">
                        1 × 1
                    </div>
                    <div id="yomi-text" class="text-xs sm:text-sm font-bold text-amber-950 bg-amber-100/90 px-3 py-0.5 rounded-full border border-amber-300">
                        いんいちがいち
                    </div>
                </div>
            </div>

            <!-- 選択肢 4択 -->
            <div class="w-full shrink-0 my-2">
                <div id="options-grid" class="flex justify-center items-center gap-2 sm:gap-4 w-full">
                    <!-- 動的に生成 -->
                </div>
            </div>

            <div class="text-center text-amber-200/70 text-[11px] shrink-0">
                せいかいの 丸いカードを選んでね！
            </div>
        </section>

        <!-- 3. クリア演出画面 -->
        <section id="clear-screen" class="hidden flex flex-col justify-center items-center h-full max-w-md mx-auto w-full py-2 relative z-40">
            <div id="clear-modal-box" class="bg-stone-950/95 border-2 border-amber-400/60 rounded-3xl p-5 shadow-2xl w-full text-center space-y-4 relative overflow-hidden">
                <div class="space-y-1">
                    <div id="clear-badge" class="inline-block px-4 py-1 rounded-full text-xs font-black bg-amber-400 text-stone-900 shadow">
                        GOLD CLEAR!
                    </div>
                    <h2 id="clear-title" class="text-2xl font-black text-amber-300 drop-shadow">1の段 クリア！</h2>
                    <p id="clear-subtitle" class="text-amber-200 text-xs sm:text-sm">バケモノカードを ゲットしたよ！</p>
                    
                    <div id="world-clear-banner" class="hidden my-2 py-2 px-3 bg-gradient-to-r from-amber-400 via-rose-500 to-purple-600 text-white font-black text-sm rounded-xl shadow-lg border-2 border-white animate-bounce">
                        🎉 上りワールド 完全クリア！ 🎉
                    </div>
                </div>

                <!-- 獲得カードプレビュー -->
                <div class="flex justify-center py-1">
                    <div id="reward-card-container" class="transform hover:scale-105 transition-transform duration-300 cursor-pointer">
                        <!-- カードDOM -->
                    </div>
                </div>

                <div class="space-y-2 pt-1">
                    <button id="next-btn" onclick="handleNextStep()" class="w-full py-3 bg-gradient-to-r from-emerald-600 to-teal-700 hover:from-emerald-500 hover:to-teal-600 text-white text-lg font-black rounded-xl shadow-lg btn-3d border border-white/20 flex items-center justify-center gap-2">
                        <span>つぎへ すすむ</span>
                        <i data-lucide="arrow-right" class="w-5 h-5"></i>
                    </button>
                    <button onclick="startStage(currentStageNumber)" class="w-full py-2.5 bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-400 hover:to-orange-500 text-white font-black text-base rounded-xl shadow-md btn-3d border border-white/20 flex items-center justify-center gap-2">
                        <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                        <span>もう１かいする</span>
                    </button>
                    <button onclick="showStageSelect()" class="w-full py-2.5 bg-rose-900 hover:bg-rose-800 text-white font-black rounded-xl shadow-md btn-3d border border-white/20 flex items-center justify-center gap-2 text-sm">
                        <i data-lucide="home" class="w-4 h-4"></i>
                        <span>メニューに戻る</span>
                    </button>
                </div>
            </div>
        </section>

        <!-- 4. アルバム（カード図鑑）画面 -->
        <section id="album-screen" class="hidden flex flex-col h-full space-y-2 overflow-hidden">
            <div class="flex justify-between items-center border-b border-amber-500/30 pb-2 shrink-0">
                <div>
                    <h2 class="text-lg sm:text-xl font-black text-amber-300 flex items-center gap-1.5">
                        <i data-lucide="award" class="w-6 h-6 text-yellow-400"></i> バケモノカードずかん
                    </h2>
                    <p class="text-amber-200 text-xs">ゲットしたカードをタップして大きくみられるよ！</p>
                </div>
                <button onclick="showStageSelect()" class="bg-rose-900 hover:bg-rose-800 text-white font-bold px-3 py-1.5 rounded-xl text-xs btn-3d border border-amber-500/40">
                    もどる
                </button>
            </div>

            <!-- レア度別フィルターボタンバー (横スクロール対応) -->
            <div id="album-filter-bar" class="flex gap-1.5 overflow-x-auto pb-1.5 shrink-0 scrollbar-none">
                <!-- JSで動的生成 -->
            </div>

            <!-- カードグリッド -->
            <div id="album-grid" class="flex-1 overflow-y-auto grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 p-1">
                <!-- 動的に生成 -->
            </div>
        </section>

        <!-- 5. カード拡大モーダル -->
        <div id="card-modal" class="hidden fixed inset-0 bg-stone-950/85 backdrop-blur-sm z-50 flex flex-col items-center justify-center p-4" onclick="closeCardModal()">
            <div class="relative transform scale-125 sm:scale-150 transition-transform duration-300" onclick="event.stopPropagation()">
                <div id="modal-card-container"></div>
            </div>
            <button onclick="closeCardModal()" class="mt-12 bg-white/20 hover:bg-white/30 text-white font-black px-6 py-2 rounded-full border border-white/40 text-sm shadow-xl backdrop-blur-md">
                とじる
            </button>
        </div>

        <!-- ゲームオーバーモーダル -->
        <div id="gameover-modal" class="hidden fixed inset-0 bg-stone-950/85 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div class="bg-stone-950 border-2 border-red-500/60 rounded-3xl p-5 max-w-sm w-full text-center space-y-4 shadow-2xl">
                <div class="w-14 h-14 bg-red-500/20 text-red-400 rounded-full flex items-center justify-center mx-auto border border-red-500/40">
                    <i data-lucide="heart-off" class="w-8 h-8"></i>
                </div>

            } else {
                const p1Cards = BAKE_CARDS.filter(c => ['C', 'U', 'R', 'RR'].includes(c.rarity));

        function saveData() {
            try {
                localStorage.setItem(SAVE_KEY, JSON.stringify({
                    unlockedStages: gameState.unlockedStages,
                    clearedRanks: gameState.clearedRanks,
                    ownedCards: gameState.ownedCards,
                    newCards: gameState.newCards
                }));
            } catch (e) {
                console.error('Save error:', e);
            }
            updateCardCountDisplay();
        }

        function loadSaveData() {
            try {
                const saved = localStorage.getItem(SAVE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (parsed.unlockedStages) gameState.unlockedStages = parsed.unlockedStages;
                    if (parsed.clearedRanks) gameState.clearedRanks = parsed.clearedRanks;
                    if (parsed.ownedCards) gameState.ownedCards = parsed.ownedCards;
                    if (parsed.newCards) gameState.newCards = parsed.newCards;
                }
            } catch (e) {
                console.error('Load error:', e);
            }

            if (!gameState.unlockedStages.asc) gameState.unlockedStages.asc = [1];
            if (!gameState.unlockedStages.desc) gameState.unlockedStages.desc = [1];
            if (!gameState.unlockedStages.rand) gameState.unlockedStages.rand = [1];
            if (!gameState.unlockedStages.master) gameState.unlockedStages.master = [1];

            updateCardCountDisplay();

        // サウンド・音声
        let audioCtx = null;
        let bgmInterval = null;

        function getAudioContext() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) audioCtx = new AudioContext();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        document.addEventListener('pointerdown', () => { getAudioContext(); }, { once: false });

        function playPinpon() {
            const ctx = getAudioContext();
            if (!ctx) return;
            const now = ctx.currentTime;

            const osc1 = ctx.createOscillator();
            const gain1 = ctx.createGain();
            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(1046.50, now);
            gain1.gain.setValueAtTime(0.3, now);
            gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
            osc1.connect(gain1);
            gain1.connect(ctx.destination);
            osc1.start(now);
            osc1.stop(now + 0.3);

            const osc2 = ctx.createOscillator();
            const gain2 = ctx.createGain();
            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(1567.98, now + 0.15);
            gain2.gain.setValueAtTime(0.3, now + 0.15);
            gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
            osc2.connect(gain2);
            gain2.connect(ctx.destination);
            osc2.start(now + 0.15);
            osc2.stop(now + 0.5);
        }

        function playBuzzer() {
            const ctx = getAudioContext();
            if (!ctx) return;
            const now = ctx.currentTime;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.setValueAtTime(120, now + 0.15);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.4);
        }

        function playFanfare(isAllClear = false) {
            const ctx = getAudioContext();
            if (!ctx) return;
            const now = ctx.currentTime;

            const notes = isAllClear 
                ? [523.25, 659.25, 783.99, 1046.50, 880.00, 1046.50, 1174.66, 1318.51]
                : [523.25, 659.25, 783.99, 1046.50];

            notes.forEach((freq, idx) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                const startTime = now + idx * 0.12;
                const duration = idx === notes.length - 1 ? 0.8 : 0.15;

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, startTime);
                gain.gain.setValueAtTime(0.3, startTime);
                gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(startTime);
                osc.stop(startTime + duration);
            });
        }

        function playCompleteFanfare() {
            const ctx = getAudioContext();
            if (!ctx) return;
            const now = ctx.currentTime;
            const notes = [523.25, 659.25, 783.99, 1046.50, 1174.66, 1318.51, 1567.98, 1760.00, 2093.00];

            notes.forEach((freq, idx) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                const startTime = now + idx * 0.1;
                const duration = idx === notes.length - 1 ? 1.5 : 0.2;

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, startTime);
                gain.gain.setValueAtTime(0.35, startTime);
                gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(startTime);
                osc.stop(startTime + duration);
            });
        }

        function startBGM() {
            stopBGM();
            const ctx = getAudioContext();
            if (!ctx) return;

            const bassNotes = [110, 110, 146.83, 110, 130.81, 110, 123.47, 98];
            const leadNotes = [440, 523.25, 659.25, 587.33, 523.25, 440, 493.88, 523.25];
            let noteIdx = 0;

            bgmInterval = setInterval(() => {
                if (!audioCtx || audioCtx.state !== 'running') return;
                const now = audioCtx.currentTime;

                const bassOsc = audioCtx.createOscillator();
                const bassGain = audioCtx.createGain();
                bassOsc.type = 'sawtooth';
                bassOsc.frequency.setValueAtTime(bassNotes[noteIdx % bassNotes.length], now);
                bassGain.gain.setValueAtTime(0.08, now);
                bassGain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
                bassOsc.connect(bassGain);
                bassGain.connect(audioCtx.destination);
                bassOsc.start(now);
                bassOsc.stop(now + 0.12);

                const leadOsc = audioCtx.createOscillator();
                const leadGain = audioCtx.createGain();
                leadOsc.type = 'square';
                leadOsc.frequency.setValueAtTime(leadNotes[noteIdx % leadNotes.length], now);
                leadGain.gain.setValueAtTime(0.05, now);
                leadGain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
                leadOsc.connect(leadGain);
                leadGain.connect(audioCtx.destination);
                leadOsc.start(now);
                leadOsc.stop(now + 0.14);

                noteIdx++;
            }, 150);
        }

        function stopBGM() {
            if (bgmInterval) {
                clearInterval(bgmInterval);
                bgmInterval = null;
            }
        }

        function speakKukuQuestion(num1, num2) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();

            const speakText = (KUKU_SPEAK_YOMI[num1] && KUKU_SPEAK_YOMI[num1][num2]) || `${num1}かける${num2}は`;
            const uttr = new SpeechSynthesisUtterance(speakText);
            uttr.lang = 'ja-JP';
            uttr.rate = 1.1;
            uttr.pitch = 1.2;
            uttr.volume = 1.0;
            window.speechSynthesis.speak(uttr);
        }

        function speakKukuAnswer(answer) {
            if (!('speechSynthesis' in window)) return;

            const speakText = KUKU_ANSWER_SPEAK[answer] || `${answer}`;
            const uttr = new SpeechSynthesisUtterance(speakText);
            uttr.lang = 'ja-JP';
            uttr.rate = 1.1;
            uttr.pitch = 1.2;
            uttr.volume = 1.0;

            setTimeout(() => {
                window.speechSynthesis.speak(uttr);
            }, 200);
        }

        function isWorldUnlocked(world) {
            if (world === 'asc') return true;
            if (world === 'desc') {
                return STAGE_ORDER.every(st => gameState.clearedRanks.asc && gameState.clearedRanks.asc[st]);
            }
            if (world === 'rand') {
                return STAGE_ORDER.every(st => gameState.clearedRanks.desc && gameState.clearedRanks.desc[st]);
            }
            if (world === 'master') {
                return STAGE_ORDER.every(st => gameState.clearedRanks.rand && gameState.clearedRanks.rand[st]);
            }
            return false;
        }

        function showToast(msg) {
            const toast = document.getElementById('toast-message');
            if (!toast) return;
            toast.innerText = msg;
            toast.classList.remove('hidden', '-translate-y-2', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.add('-translate-y-2', 'opacity-0');
                setTimeout(() => toast.classList.add('hidden'), 300);
            }, 2500);
        }

        function switchWorld(world) {
            if (!isWorldUnlocked(world)) {
                if (world === 'desc') {
                    showToast('🔒 「① 上り」を全クリアすると開放！');
                } else if (world === 'rand') {
                    showToast('🔒 「② 下り」を全クリアすると開放！');
                } else if (world === 'master') {
                    showToast('🔒 「③ ランダム」を全クリアすると開放！');
                }
                playBuzzer();
                return;
            }

            gameState.currentWorld = world;
            renderWorldTabs();
            renderStages();

        function renderWorldTabs() {
            const worlds = [
                { id: 'asc', name: '① 上り' },
                { id: 'desc', name: '② 下り' },
                { id: 'rand', name: '③ ランダム' },
                { id: 'master', name: '④ マスター' }
            ];

            worlds.forEach(w => {
                const btn = document.getElementById(`tab-${w.id}`);
                if (!btn) return;

                const unlocked = isWorldUnlocked(w.id);
                const isActive = gameState.currentWorld === w.id;

                if (!unlocked) {
                    btn.className = "flex-1 min-w-[90px] py-1.5 px-2 rounded-xl font-black text-xs sm:text-sm transition-all bg-stone-950/90 text-stone-600 border border-stone-800 opacity-60 flex items-center justify-center gap-1 cursor-not-allowed";

        function startStage(stageNum) {
            currentStageNumber = stageNum;
            gameState.currentStage = stageNum;
            gameState.lives = 3;
            gameState.currentQuestionIndex = 0;
            gameState.currentMonsterIndex = 0;
            gameState.questions = generateQuestions(stageNum, gameState.currentWorld);

            hideAllScreens();
            document.getElementById('game-screen').classList.remove('hidden');

            const worldNameMap = { asc: '① 上りワールド', desc: '② 下りワールド', rand: '③ ランダムワールド', master: '④ マスターリーグ' };
            
            if (gameState.currentWorld === 'master') {
                document.getElementById('current-stage-title').innerText = `マスターリーグ`;
            } else {
                document.getElementById('current-stage-title').innerText = `${stageNum}の段`;
            }
            document.getElementById('current-round-tag').innerText = worldNameMap[gameState.currentWorld] || 'ワールド';

            const targetBox = document.getElementById('target-pokemon-scale-box');
            if (targetBox) {
                targetBox.classList.remove('opacity-0', 'scale-0');
            }
            const stars = document.getElementById('capture-stars');
            if (stars) stars.classList.add('hidden');

            updateHeartsUI();
            updateMasterGaugeUI();
            renderMonsterSvg();
            showQuestion();
            startBGM();
        }

        function generateQuestions(stageNum, world) {
            if (world === 'master') {
                const masterStages = [6, 7, 8, 9];
                const pool = [];
                masterStages.forEach(n1 => {
                    for (let n2 = 2; n2 <= 9; n2++) {
                        pool.push({ num1: n1, num2: n2, answer: n1 * n2 });
                    }
                });
                pool.sort(() => Math.random() - 0.5);
                return pool.slice(0, 10);
            }

            let multiplierList = [1, 2, 3, 4, 5, 6, 7, 8, 9];
            if (world === 'desc') {
                multiplierList = [9, 8, 7, 6, 5, 4, 3, 2, 1];
            } else if (world === 'rand') {
                multiplierList.sort(() => Math.random() - 0.5);
            }
            return multiplierList.map(m => ({
                num1: stageNum,
                num2: m,
                answer: stageNum * m
            }));
        }

        function updateHeartsUI() {
            const container = document.getElementById('hearts-container');
            if (!container) return;
            container.innerHTML = '';
            const totalHearts = 3;

            for (let i = 0; i < totalHearts; i++) {
                const heart = document.createElement('i');
                heart.setAttribute('data-lucide', 'heart');
                if (i < gameState.lives) {
                    heart.className = "w-6 h-6 text-red-500 fill-red-500";
                } else {
                    heart.className = "w-6 h-6 text-stone-700 fill-stone-800 opacity-40";
                }
                container.appendChild(heart);
            }
            if (window.lucide) lucide.createIcons();
        }

        function updateMasterGaugeUI() {
            const container = document.getElementById('master-gauge-container');
            const boxesContainer = document.getElementById('master-gauge-boxes');
            if (!container || !boxesContainer) return;

            if (gameState.currentWorld !== 'master') {
                container.classList.add('hidden');
                return;
            }

            container.classList.remove('hidden');
            boxesContainer.innerHTML = '';

            const remaining = Math.max(0, 10 - gameState.currentQuestionIndex);

            for (let i = 0; i < 10; i++) {
                const box = document.createElement('div');
                if (i < remaining) {
                    box.className = "flex-1 h-3.5 sm:h-4 rounded-md bg-gradient-to-r from-amber-400 via-yellow-300 to-amber-500 border border-white shadow-sm transition-all duration-300";
                } else {
                    box.className = "flex-1 h-3.5 sm:h-4 rounded-md bg-stone-900 border border-stone-800 opacity-20 transition-all duration-300";
                }
                boxesContainer.appendChild(box);
            }
        }

        function renderMonsterSvg() {
            const box = document.getElementById('pixel-monster-svg-box');
            if (!box) return;

            const totalQ = gameState.questions.length || 9;
            const progress = gameState.currentQuestionIndex / totalQ;
            const scaleBox = document.getElementById('target-pokemon-scale-box');
            if (scaleBox) {
                const scale = Math.max(0.4, 2.4 - (progress * 1.9));
                scaleBox.style.transform = `scale(${scale})`;
            }

            const icons = ['🦑', '🐟', '🦈', '🤖'];
            const currentIcon = icons[gameState.currentQuestionIndex % icons.length];
            box.innerHTML = `<div class="text-6xl filter drop-shadow-xl select-none">${currentIcon}</div>`;
        }

        function showQuestion() {
            isProcessingAnswer = false;
            const q = gameState.questions[gameState.currentQuestionIndex];
            if (!q) return;

            document.getElementById('question-text').innerText = `${q.num1} × ${q.num2}`;

            const yomiDict = KUKU_YOMI[q.num1] || {};
            document.getElementById('yomi-text').innerText = yomiDict[q.num2] || '';

            speakKukuQuestion(q.num1, q.num2);

            const optionsGrid = document.getElementById('options-grid');
            optionsGrid.innerHTML = '';

            const shuffled = generateSmartOptions(q);

            shuffled.forEach(ans => {
                const btn = document.createElement('button');
                btn.className = "w-16 h-16 sm:w-20 sm:h-20 rounded-full bg-gradient-to-tr from-rose-800 via-rose-700 to-amber-600 border-4 border-amber-300/80 text-white text-xl sm:text-2xl font-black shadow-xl btn-3d flex items-center justify-center hover:scale-105 transition-transform";
                btn.innerText = ans;
                btn.onclick = (e) => checkAnswer(ans, btn);
                optionsGrid.appendChild(btn);
            });
        }

        function generateSmartOptions(q) {
            const num1 = q.num1;
            const num2 = q.num2;
            const answer = q.answer;

            const candidates = new Set();

            [num2 - 1, num2 + 1, num2 - 2, num2 + 2].forEach(n2 => {
                if (n2 >= 1) {
                    const val = num1 * n2;
                    if (val > 0 && val !== answer) candidates.add(val);
                }
            });

            [num1 - 1, num1 + 1].forEach(n1 => {
                if (n1 >= 1 && n1 <= 9) {
                    const val = n1 * num2;
                    if (val > 0 && val !== answer) candidates.add(val);
                }
            });

            [answer - 1, answer + 1, answer - 2, answer + 2, answer - 10, answer + 10].forEach(val => {
                if (val > 0 && val <= 81 && val !== answer) candidates.add(val);
            });

            const allProducts = [];
            for (let i = 1; i <= 9; i++) {
                for (let j = 1; j <= 9; j++) {
                    allProducts.push(i * j);
                }
            }
            allProducts.sort((a, b) => Math.abs(a - answer) - Math.abs(b - answer));
            allProducts.forEach(val => {
                if (val !== answer) candidates.add(val);
            });

            const sortedCandidates = Array.from(candidates).sort((a, b) => Math.abs(a - answer) - Math.abs(b - answer));
            const topPool = sortedCandidates.slice(0, Math.min(7, sortedCandidates.length));
            topPool.sort(() => Math.random() - 0.5);

            const wrongOptions = topPool.slice(0, 3);
            const result = [answer, ...wrongOptions];

            return result.sort(() => Math.random() - 0.5);
        }

        function checkAnswer(selectedAns, btn) {
            if (isProcessingAnswer) return;
            const q = gameState.questions[gameState.currentQuestionIndex];
            if (!q) return;

            if (selectedAns === q.answer) {
                isProcessingAnswer = true;
                playPinpon();
                speakKukuAnswer(q.answer);

                btn.classList.remove('from-rose-800', 'via-rose-700', 'to-amber-600');
                btn.classList.add('from-emerald-600', 'to-teal-600', 'scale-110');

                const isFinalQuestion = (gameState.currentQuestionIndex + 1 >= gameState.questions.length);

                if (!isFinalQuestion) {
                    const missile = document.getElementById('missile-anim');
                    if (missile) {
                        missile.classList.remove('hidden');
                        missile.classList.add('animate-fly-missile');
                        setTimeout(() => {
                            missile.classList.add('hidden');
                            missile.classList.remove('animate-fly-missile');
                            
                            const hit = document.getElementById('hit-explosion');
                            if (hit) {
                                hit.classList.remove('hidden');
                                setTimeout(() => hit.classList.add('hidden'), 350);
                            }
                        }, 400);
                    }

                    setTimeout(() => {
                        gameState.currentQuestionIndex++;
                        updateMasterGaugeUI();
                        renderMonsterSvg();
                        showQuestion();
                    }, 1200);
                } else {
                    gameState.currentQuestionIndex++;
                    updateMasterGaugeUI();

                    const targetBox = document.getElementById('target-pokemon-scale-box');
                    const stars = document.getElementById('capture-stars');
                    const hit = document.getElementById('hit-explosion');

                    setTimeout(() => {
                        if (hit) {
                            hit.innerHTML = '<div class="text-5xl animate-ping">✨</div>';
                            hit.classList.remove('hidden');
                        }

                        if (stars) {
                            stars.innerText = '✨ FLASH! ✨';
                            stars.classList.remove('hidden');
                        }

                        setTimeout(() => {
                            if (targetBox) {
                                targetBox.classList.add('opacity-0', 'scale-0', 'transition-all', 'duration-500');
                            }
                        }, 300);

                        setTimeout(() => {
                            if (hit) hit.classList.add('hidden');
                            handleStageClear();
                        }, 1600);

                    }, 300);
                }

            } else {
                playBuzzer();
                btn.classList.add('animate-shake', 'from-rose-700', 'to-red-800');
                setTimeout(() => btn.classList.remove('animate-shake'), 400);

                gameState.lives--;
                updateHeartsUI();

                if (gameState.lives <= 0) {
                    stopBGM();
                    document.getElementById('gameover-modal').classList.remove('hidden');
                }
            }
        }

        function handleStageClear() {
            stopBGM();

            const world = gameState.currentWorld;
            const stage = gameState.currentStage;

            let rank = 'bronze';
            if (gameState.lives === 3 || world === 'master') rank = 'gold';
            else if (gameState.lives === 2) rank = 'silver';

            const isAlreadyCleared = !!gameState.clearedRanks[world][stage];

            const currentRank = gameState.clearedRanks[world][stage];
            const rankWeight = { gold: 3, silver: 2, bronze: 1 };
            if (!currentRank || rankWeight[rank] > (rankWeight[currentRank] || 0)) {
                gameState.clearedRanks[world][stage] = rank;
            }

            if (world !== 'master') {
                const currentIndex = STAGE_ORDER.indexOf(stage);
                if (currentIndex >= 0 && currentIndex < STAGE_ORDER.length - 1) {
                    const nextStageNum = STAGE_ORDER[currentIndex + 1];
                    if (!gameState.unlockedStages[world].includes(nextStageNum)) {
                        gameState.unlockedStages[world].push(nextStageNum);
                    }
                }
            }

            const prevOwnedCount = gameState.ownedCards.length;
            const prevPhase1Cleared = isFirstPhaseComplete();

            const newCard = getRandomBakeCard(rank, stage, world, isAlreadyCleared);
            if (newCard) {
                if (!gameState.ownedCards.includes(newCard.id)) {
                    gameState.ownedCards.push(newCard.id);
                    if (!gameState.newCards.includes(newCard.id)) {
                        gameState.newCards.push(newCard.id);
                    }
                } else {
                    const idx = gameState.newCards.indexOf(newCard.id);
                    if (idx !== -1) {
                        gameState.newCards.splice(idx, 1);
                    }
                }
            }

            saveData();

            const currentOwnedCount = gameState.ownedCards.length;
            const currentPhase1Cleared = isFirstPhaseComplete();

            const clearBadge = document.getElementById('clear-badge');
            if (rank === 'gold') {
                clearBadge.innerText = '🥇 PERFECT GOLD!';
                clearBadge.className = 'inline-block px-4 py-1 rounded-full text-xs font-black bg-amber-400 text-stone-950 shadow gold-glow';
            } else if (rank === 'silver') {
                clearBadge.innerText = '🥈 SILVER CLEAR';
                clearBadge.className = 'inline-block px-4 py-1 rounded-full text-xs font-black bg-slate-300 text-stone-950 shadow';
            } else {
                clearBadge.innerText = '🥉 BRONZE CLEAR';
                clearBadge.className = 'inline-block px-4 py-1 rounded-full text-xs font-black bg-amber-800 text-white shadow';
            }

            document.getElementById('clear-title').innerText = (world === 'master') ? `マスターリーグ クリア！` : `${stage}の段 クリア！`;

            const banner = document.getElementById('world-clear-banner');

            const reached40 = !prevPhase1Cleared && currentPhase1Cleared;
            const reached60 = (prevOwnedCount < 60) && (currentOwnedCount === 60);
            const isAlwaysCelebrate = (currentOwnedCount === 60);

            if (reached60) {
                banner.innerText = '👑 バケモノカード図鑑 60種コンプリート達成！！ 👑';
                banner.classList.remove('hidden');
                launchCelebration(true, true);
                playCompleteFanfare();
            } else if (reached40) {
                banner.innerText = '✨ RRまで40種コンプリート！AR〜MUR解禁！！ ✨';
                banner.classList.remove('hidden');
                launchCelebration(false, true);
                playFanfare(true);
            } else if (isAlwaysCelebrate) {
                banner.innerText = '👑 図鑑コンプリート中！ 👑';
                banner.classList.remove('hidden');
                launchCelebration(false, false);
                playFanfare(false);
            } else {
                banner.classList.add('hidden');
            }

            const cardBox = document.getElementById('reward-card-container');
            if (cardBox && newCard) {
                cardBox.innerHTML = createCardHtml(newCard);
            }

            hideAllScreens();
            document.getElementById('clear-screen').classList.remove('hidden');
        }

        // カードドロップ制御ロジック
        function getRandomBakeCard(rank, stageNum, world, isAlreadyCleared) {
            const isPhase1Done = isFirstPhaseComplete();

            // 40枚コンプ前 (!isPhase1Done) の場合、カードプールは絶対に ['C', 'U', 'R', 'RR'] のみに限定
            let baseCards = BAKE_CARDS;
            if (!isPhase1Done) {
                baseCards = BAKE_CARDS.filter(c => ['C', 'U', 'R', 'RR'].includes(c.rarity));
            }

            // ワールド＆段ごとの基本レアリティ定義
            let allowedRarities = ['C', 'U'];

            if (world === 'asc' || world === 'desc') {
                if (stageNum === 1 || stageNum === 5 || stageNum === 2) {
                    allowedRarities = ['C', 'U'];
                } else if (stageNum === 3 || stageNum === 4) {
                    allowedRarities = ['C', 'U', 'R'];
                } else {
                    allowedRarities = ['C', 'U', 'R', 'RR'];
                }
            } else if (world === 'rand') {
                if (stageNum === 1 || stageNum === 5 || stageNum === 2) {
                    allowedRarities = ['C', 'U', 'R'];
                } else if (stageNum === 3 || stageNum === 4) {
                    allowedRarities = ['C', 'U', 'R', 'RR'];
                } else {
                    allowedRarities = ['C', 'U', 'R', 'RR', 'AR', 'SR'];
                }
            } else if (world === 'master') {
                allowedRarities = ['C', 'U', 'R', 'RR', 'AR', 'SR', 'SAR', 'UR', 'MUR'];
            }

            // 40枚達成前は絶対に ['C', 'U', 'R', 'RR'] より上のレアリティを除外
            if (!isPhase1Done) {
                allowedRarities = allowedRarities.filter(r => ['C', 'U', 'R', 'RR'].includes(r));
            }

            // 1の段・5の段ではRR以上のカードは絶対に出ない
            if (stageNum === 1 || stageNum === 5) {
                allowedRarities = allowedRarities.filter(r => r === 'C' || r === 'U' || r === 'R');
            }

            // 許可されたレアリティの対象カードプール
            let targetPool = baseCards.filter(c => allowedRarities.includes(c.rarity));
            if (targetPool.length === 0) targetPool = baseCards;

            const unownedInPool = targetPool.filter(c => !gameState.ownedCards.includes(c.id));
            const ownedInPool = targetPool.filter(c => gameState.ownedCards.includes(c.id));

            // ★ マスターモード、6の段、7の段、8の段判定
            const isMustNewStage = (world === 'master' || stageNum === 6 || stageNum === 7 || stageNum === 8);

            if (isMustNewStage) {
                // マスターモード、6の段、7の段、8の段をクリアしたら、必ず「NEW」のカードが引ける
                if (unownedInPool.length > 0) {
                    return pickWeightedCard(unownedInPool);
                } else {
                    const allUnowned = baseCards.filter(c => !gameState.ownedCards.includes(c.id));
                    if (allUnowned.length > 0) {
                        return pickWeightedCard(allUnowned);
                    }
                    return pickWeightedCard(targetPool);
                }
            } else {
                // それ以外の段：90％の確率で被る（10％の確率で「NEW」が出る）
                const wantNew = (Math.random() < 0.10);

                if (wantNew && unownedInPool.length > 0) {
                    return pickWeightedCard(unownedInPool);
                } else if (!wantNew && ownedInPool.length > 0) {
                    return pickWeightedCard(ownedInPool);
                } else {
                    if (unownedInPool.length > 0) {
                        return pickWeightedCard(unownedInPool);
                    }
                    return pickWeightedCard(targetPool);
                }
            }
        }

        function handleNextStep() {
            if (gameState.currentWorld === 'master') {
                showStageSelect();
                return;
            }
            const currentIndex = STAGE_ORDER.indexOf(gameState.currentStage);
            if (currentIndex >= 0 && currentIndex < STAGE_ORDER.length - 1) {
                const nextStage = STAGE_ORDER[currentIndex + 1];
                startStage(nextStage);
            } else {
                showStageSelect();
            }
        }

        function retryCurrentStage() {
            startStage(gameState.currentStage);
        }

                <!-- バンザイ手足 -->
                <path d="M16 10 L11 2 M18 10 L23 2" fill="none" stroke="#000" stroke-width="1.4" stroke-linecap="round"/>
                <path d="M14 24 L14 32 L11 33 M20 24 L20 32 L22 33" fill="none" stroke="#000" stroke-width="1.4" stroke-linecap="round"/>
            `;

            // 3. 鮫タイプ (添付イラスト「サメ型モンスター.jpg」準拠: 左向き大口、鋭い牙、背びれ、尾びれ)
            const sharkParts = `
                <!-- 鮫本体 -->
                <path d="M2 18 C2 4 22 2 32 12 C34 18 30 26 22 26 C12 26 2 24 2 18 Z" fill="${accent}" stroke="#000" stroke-width="1.2"/>
                <!-- 大口＆ギラギラ牙 -->
                <path d="M4 14 Q14 16 14 22 Q4 24 4 14 Z" fill="#2b080c" stroke="#000" stroke-width="1.2"/>
                <path d="M5 14 L7 17 L9 14 L11 17 L13 15 M5 23 L7 20 L9 23 L11 20 L13 22" fill="none" stroke="#fff" stroke-width="0.9"/>
                <ellipse cx="8" cy="8" rx="1.5" ry="1" fill="#000"/>
                <!-- 背びれ・尾びれ -->
                <path d="M18 6 L22 -4 L25 7 Z" fill="${accent}" stroke="#000" stroke-width="1.2"/>
                <path d="M30 12 L36 4 L32 14 L36 24 Z" fill="${accent}" stroke="#000" stroke-width="1.2"/>
            `;

            // 4. ロボットタイプ (添付イラスト「ロボット型モンスター.jpg」準拠: 画面顔、帽子型アンテナ、胸のギヤ＆魚モチーフ、長い手足)
            const robotParts = `
                <!-- 頭部画面＆帽子型アンテナ -->
                <rect x="13" y="0" width="6" height="4" rx="1" fill="#fff" stroke="#000" stroke-width="1"/>
                <rect x="7" y="5" width="18" height="13" rx="2" fill="${accent}" stroke="#000" stroke-width="1.2"/>
                <rect x="9" y="7" width="14" height="9" rx="1" fill="#fff" stroke="#000" stroke-width="1"/>
                <rect x="10" y="9" width="3" height="3" fill="#000"/>
                <rect x="18" y="9" width="3" height="3" fill="#000"/>
                <path d="M12 14 Q16 16 20 14" fill="none" stroke="#000" stroke-width="1"/>
                <!-- 胴体＆胸ギヤ・魚モチーフ -->
                <path d="M7 18 L25 18 L24 30 L8 30 Z" fill="${accent}" stroke="#000" stroke-width="1.2"/>
                <circle cx="16" cy="24" r="3" fill="#fff" stroke="#000" stroke-width="0.8"/>
                <path d="M16 21 L18 24 L14 24 Z" fill="#f59e0b"/>
                <!-- 長い腕脚 -->
                <path d="M7 20 L1 29 M25 20 L31 29" stroke="#000" stroke-width="1.8" stroke-linecap="round"/>
                <path d="M11 30 L11 38 M21 30 L21 38" stroke="#000" stroke-width="1.8" stroke-linecap="round"/>
            `;

            let contentSvg = '';
            if (bakeType === 'squid') contentSvg = squidParts;
            else if (bakeType === 'fish') contentSvg = fishParts;
            else if (bakeType === 'shark') contentSvg = sharkParts;
            else if (bakeType === 'robot') contentSvg = robotParts;

            // 高レアリティ（SR, SAR, UR, MUR）の派手なオーラ装飾
            let auraSvg = '';
            if (['SR', 'SAR', 'UR', 'MUR'].includes(rarity)) {
                auraSvg = `
                    <circle cx="16" cy="16" r="18" fill="none" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3 3"/>
                    <path d="M16 -2 L18 2 L14 2 Z M34 16 L30 18 L30 14 Z M16 34 L14 30 L18 30 Z M-2 16 L2 14 L2 18 Z" fill="#fbbf24"/>
                `;
            }

            return `
                <svg class="w-24 h-24 filter drop-shadow-md" viewBox="-10 -8 52 52" style="transform: scale(${scale});">
                    <g>
                        ${auraSvg}
                        ${contentSvg}
                    </g>
                </svg>
            `;
        }

        // アルバム（ずかん）機能
        function renderAlbumFilters() {
            const filterBar = document.getElementById('album-filter-bar');
            if (!filterBar) return;

            const isPhase1Done = isFirstPhaseComplete();
            
            const filters = isPhase1Done
                ? ['ALL', ...RARITY_ORDER]
                : ['ALL', 'C', 'U', 'R', 'RR'];

            filterBar.innerHTML = '';

            filters.forEach(rarity => {
                const btn = document.createElement('button');
                
                let count = 0;
                let totalInRarity = 0;

                if (rarity === 'ALL') {
                    if (isPhase1Done) {
                        count = gameState.ownedCards.length;
                        totalInRarity = 60;
                    } else {
                        const p1Cards = BAKE_CARDS.filter(c => ['C', 'U', 'R', 'RR'].includes(c.rarity));
                        count = p1Cards.filter(c => gameState.ownedCards.includes(c.id)).length;
                        totalInRarity = 40;
                    }
                } else {
                    count = BAKE_CARDS.filter(c => c.rarity === rarity && gameState.ownedCards.includes(c.id)).length;
                    totalInRarity = BAKE_CARDS.filter(c => c.rarity === rarity).length;
                }

                const isActive = currentAlbumFilter === rarity;

                btn.className = `px-3 py-1 rounded-full text-xs font-black whitespace-nowrap transition-all ${
                    isActive 
                        ? 'bg-amber-400 text-stone-950 border-2 border-white shadow' 
                        : 'bg-stone-900 text-amber-200/80 hover:bg-stone-800 border border-amber-500/30'
                }`;
                btn.innerText = `${rarity} (${count}/${totalInRarity})`;
                btn.onclick = () => {
                    currentAlbumFilter = rarity;
                    renderAlbumFilters();
                    renderAlbumGrid();
                };
                filterBar.appendChild(btn);
            });
        }

        function showAlbum() {
            stopBGM();
            hideAllScreens();
            document.getElementById('album-screen').classList.remove('hidden');
            renderAlbumFilters();
            renderAlbumGrid();
        }

        function renderAlbumGrid() {
            const grid = document.getElementById('album-grid');
            if (!grid) return;
            grid.innerHTML = '';

            const isPhase1Done = isFirstPhaseComplete();

            let availableCards = isPhase1Done
                ? BAKE_CARDS
                : BAKE_CARDS.filter(c => ['C', 'U', 'R', 'RR'].includes(c.rarity));

            let filteredCards = availableCards;
            if (currentAlbumFilter !== 'ALL') {
                filteredCards = availableCards.filter(c => c.rarity === currentAlbumFilter);
            }

            filteredCards.forEach(card => {
                const isOwned = gameState.ownedCards.includes(card.id);
                const wrapper = document.createElement('div');
                wrapper.className = "flex justify-center items-center cursor-pointer transform hover:scale-105 transition-transform duration-200";

                if (isOwned) {
                    wrapper.innerHTML = createCardHtml(card);
                    wrapper.onclick = () => showCardModal(card);
                } else {
                    wrapper.innerHTML = `
                        <div class="w-full h-44 sm:h-52 rounded-2xl bg-stone-950/80 border-2 border-stone-800 flex flex-col items-center justify-center text-stone-600 p-2 text-center shadow-inner relative overflow-hidden">
                            <i data-lucide="lock" class="w-8 h-8 mb-2 text-stone-600"></i>
                            <span class="text-xs font-bold text-stone-500">???</span>
                            <span class="text-[10px] text-stone-600 mt-1 uppercase font-bold">${card.rarity}</span>
                        </div>
                    `;
                }
                grid.appendChild(wrapper);
            });

            if (window.lucide) lucide.createIcons();
        }

        function showCardModal(card) {
            const container = document.getElementById('modal-card-container');
            if (!container) return;
            container.innerHTML = createCardHtml(card, true);

            const newIndex = gameState.newCards.indexOf(card.id);
            if (newIndex !== -1) {
                gameState.newCards.splice(newIndex, 1);
                saveData();
                renderAlbumGrid();
            }

            document.getElementById('card-modal').classList.remove('hidden');
        }

        function closeCardModal() {
            document.getElementById('card-modal').classList.add('hidden');
        }

        // お祝い演出
        let celebrationAnimId = null;

        function launchCelebration(isComplete = false, isAllClear = false) {
            const canvas = document.getElementById('celebration-canvas');
            if (!canvas) return;
            canvas.classList.remove('hidden');
            const ctx = canvas.getContext('2d');
            
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            const fireworks = [];

            const particleCount = isComplete ? 200 : (isAllClear ? 150 : 80);
            const colors = ['#f43f5e', '#ec4899', '#d946ef', '#a855f7', '#6366f1', '#3b82f6', '#06b6d4', '#10b981', '#84cc16', '#eab308', '#f97316'];

            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    size: Math.random() * 8 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    vx: Math.random() * 2 - 1,
                    vy: Math.random() * 3 + 2,
                    rot: Math.random() * 360,
                    vRot: Math.random() * 10 - 5
                });
            }

            function createFirework() {
                const fx = Math.random() * (canvas.width * 0.8) + canvas.width * 0.1;
                const fy = Math.random() * (canvas.height * 0.5) + canvas.height * 0.1;
                const count = Math.floor(Math.random() * 30) + 40;
                const fwColor = colors[Math.floor(Math.random() * colors.length)];

                for (let i = 0; i < count; i++) {
                    const angle = (Math.PI * 2 / count) * i + Math.random() * 0.2;
                    const speed = Math.random() * 5 + 3;
                    fireworks.push({
                        x: fx,
                        y: fy,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        size: Math.random() * 3 + 2,
                        color: fwColor,
                        alpha: 1,
                        decay: Math.random() * 0.02 + 0.015
                    });
                }
            }

            let fwTimer = 0;
            const fwFrequency = isComplete ? 12 : 25;

            if (celebrationAnimId) cancelAnimationFrame(celebrationAnimId);

            function loop() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                fwTimer++;
                if (fwTimer % fwFrequency === 0) {
                    createFirework();
                }

                for (let i = fireworks.length - 1; i >= 0; i--) {
                    const fw = fireworks[i];
                    fw.x += fw.vx;
                    fw.y += fw.vy;
                    fw.vy += 0.05;
                    fw.alpha -= fw.decay;

                    if (fw.alpha <= 0) {
                        fireworks.splice(i, 1);
                        continue;
                    }

                    ctx.save();
                    ctx.globalAlpha = fw.alpha;
                    ctx.fillStyle = fw.color;
                    ctx.beginPath();
                    ctx.arc(fw.x, fw.y, fw.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.rot += p.vRot;

                    if (p.y > canvas.height) {
                        p.y = -10;
                        p.x = Math.random() * canvas.width;
                    }

                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate((p.rot * Math.PI) / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                    ctx.restore();
                });

                celebrationAnimId = requestAnimationFrame(loop);
            }

            loop();

            setTimeout(() => {
                if (celebrationAnimId) cancelAnimationFrame(celebrationAnimId);
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                canvas.classList.add('hidden');
            }, isComplete ? 8000 : 5000);
        }

        // ウィンドウロード時初期化
        window.onload = function() {
            loadSaveData();
            showStageSelect();
        };
    </script>
</body>
